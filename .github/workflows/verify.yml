name: Verify

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend dependencies
        working-directory: ./Frontend
        run: bun install --frozen-lockfile

      - name: Verify Frontend
        working-directory: ./Frontend
        run: |
          bun run format:check
          bun run lint
          bun run build

      - name: Verify Backend
        run: |
          dotnet restore ScreenLoop.sln --locked-mode
          dotnet format ScreenLoop.sln --no-restore --verify-no-changes
          dotnet build ScreenLoop.sln -c Release --no-restore
        shell: pwsh
